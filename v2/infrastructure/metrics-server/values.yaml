args:
  - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
  # Talos-specific: Talos does not populate the requestheader-client-ca-file
  # configmap in the way the aggregation layer expects. Without this flag,
  # Metrics Server blocks after cache sync waiting to validate the requestheader
  # CA — which never completes on Talos. Setting it empty bypasses that check.
  # This does NOT affect kubelet TLS verification (still enforced via
  # properly signed kubelet certs from kubelet-csr-approver).
  - --requestheader-client-ca-file=
  # Verbosity level 2 — shows scrape attempts and errors without being noisy.
  # Remove once metrics are confirmed working.
  - --v=2

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

apiService:
  create: true
  insecureSkipTLSVerify: false

serviceMonitor:
  enabled: false  # flip to true once kube-prometheus-stack is deployed