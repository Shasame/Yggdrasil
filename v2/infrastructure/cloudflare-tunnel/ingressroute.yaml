# jellyfin-public-ingressroute.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-public
  namespace: media
spec:
  entryPoints:
    - tunnel-web
  routes:
    - match: Host(`jellyfin.shasame.fr`)
      kind: Rule
      services:
        - name: jellyfin
          port: 8096
---
