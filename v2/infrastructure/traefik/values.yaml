# ============================================================
# Deployment
# ============================================================
deployment:
  replicas: 1  # Single-node phase. Scale when Mini PCs join.

# ============================================================
# Gateway API — DISABLED
# ============================================================
# Cilium already owns the Gateway API CRDs (gatewayclasses, gateways,
# httproutes, grpcroutes, referencegrants). These three blocks must ALL
# be explicitly disabled — chart defaults have gateway and gatewayClass
# enabled:true regardless of the provider flag below.
gateway:
  enabled: false  # Do not deploy a Gateway CR (requires Gateway API CRDs)

gatewayClass:
  enabled: false  # Do not deploy a GatewayClass CR

providers:
  kubernetesCRD:
    enabled: true
    # IngressRoute can only reference services in its own namespace.
    allowCrossNamespace: false
    # Allow ExternalName services — needed for some cross-namespace patterns.
    allowExternalNameServices: true

  kubernetesIngress:
    enabled: true
    # Publish Traefik's LoadBalancer IP to Ingress .status.loadBalancer
    # so ArgoCD and other controllers can see the assigned IP.
    publishedService:
      enabled: true

  kubernetesGateway:
    # Gateway API provider disabled — Cilium owns these CRDs.
    enabled: false

# ============================================================
# Entry Points
# ============================================================
ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    # Redirect all HTTP → HTTPS at the entry point level.
    # Fires before any routing decision — more efficient than per-route middleware.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true  # 301 — clients will cache this redirect

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http:
      tls:
        # TLS termination at this entry point.
        enabled: true

# ============================================================
# Service (MetalLB integration)
# ============================================================
# v40 schema change: LoadBalancer type is set under service.spec, not service.type.
service:
  enabled: true
  spec:
    type: LoadBalancer
    # Pin Traefik to 192.168.1.206 from the MetalLB pool.
    # This frees .205 from ArgoCD once the IngressRoute migration is done.
    # Do not change this after first deploy without coordinating DNS updates.
    loadBalancerIP: "192.168.1.206"

# ============================================================
# TLS Options (global defaults)
# ============================================================
# Defined as TLSOption CRDs by the chart.
tlsOptions:
  default:
    # TLS 1.2 minimum. TLS 1.0/1.1 are broken — never enable.
    minVersion: VersionTLS12
    sniStrict: true  # Reject connections with no SNI — hardens the entry point

# ============================================================
# Logging
# ============================================================
logs:
  general:
    level: INFO  # Switch to DEBUG temporarily when diagnosing cert or routing issues
  access:
    enabled: true  # Essential for debugging routing problems

# ============================================================
# Metrics (Prometheus)
# ============================================================
# Hooks are wired now so the observability stack (phase 2) can scrape
# without requiring a chart upgrade.
metrics:
  prometheus:
    enabled: true
    serviceMonitor:
      # Flip to true once kube-prometheus-stack is deployed.
      enabled: false
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# ============================================================
# Dashboard
# ============================================================
# Auto-generated IngressRoute disabled — it has no authentication.
# A properly auth-protected IngressRoute will be added once
# Dex + OAuth2 Proxy are deployed.
ingressRoute:
  dashboard:
    enabled: false

api:
  dashboard: true  # Dashboard API kept enabled, just not exposed yet

# ============================================================
# RBAC / ServiceAccount
# ============================================================
rbac:
  enabled: true

# Empty string = chart auto-generates name from fullname template ("traefik").
# Do not set a custom name — let the chart own the ServiceAccount lifecycle.
serviceAccount:
  name: ""

# ============================================================
# Resources
# ============================================================
# Traefik is in the hot path for all HTTP traffic — guaranteed CPU request.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# ============================================================
# Security Context
# ============================================================
# v40 schema change: runAsUser/runAsNonRoot live in podSecurityContext.
# securityContext covers container-level capabilities only.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault