# Traefik Helm values
# Chart: traefik/traefik v33.2.0  →  Traefik Proxy v3.3.x
# https://artifacthub.io/packages/helm/traefik/traefik

# ============================================================
# Deployment
# ============================================================
deployment:
  replicas: 1

# ============================================================
# Entry Points
# ============================================================
# Two entry points: web (80, redirect-only) and websecure (443, TLS termination).
# All real traffic flows through websecure. web exists solely to redirect
# HTTP clients — never serve content over plain HTTP.
ports:
  web:
    port: 8000        # Internal container port
    expose:
      default: true
    exposedPort: 80   # External port via LoadBalancer
    protocol: TCP
    # Redirect all HTTP → HTTPS at the entry point level.
    # This is more efficient than per-route middleware because it fires
    # before any routing decision is made.
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true  # 301, not 302 — clients will cache this

  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    http2:
      maxConcurrentStreams: 250
    tls:
      enabled: true  # TLS termination at this entry point

# ============================================================
# Service (MetalLB integration)
# ============================================================
service:
  type: LoadBalancer
  loadBalancerIP: "192.168.1.206" #Update requires DNS updates

# ============================================================
# Providers
# ============================================================
providers:
  # KubernetesCRD: watches IngressRoute, Middleware, etc.
  # This is the primary routing mechanism for this cluster.
  kubernetesCRD:
    enabled: true
    # allowCrossNamespace: false by default — IngressRoute can only reference
    # services in its own namespace. Set true only if you have a specific need.
    allowCrossNamespace: false
    # Allow IngressRoutes to use ExternalName services (needed for some
    # cross-namespace routing patterns with Tailscale later).
    allowExternalNameServices: true

  # KubernetesIngress: watches standard Ingress resources.
  # Keep enabled — some Helm charts only emit Ingress, not IngressRoute.
  kubernetesIngress:
    enabled: true
    # Publish the Traefik LoadBalancer IP to Ingress .status.loadBalancer
    # so other controllers (and ArgoCD) can see the assigned IP.
    publishedService:
      enabled: true

# ============================================================
# TLS Options (global defaults)
# ============================================================
tlsOptions:
  default:
    # Enforce TLS 1.2 minimum. TLS 1.0/1.1 are broken — never enable.
    # TLS 1.3 is preferred but 1.2 is needed for some older clients.
    minVersion: VersionTLS12
    sniStrict: true  # Reject connections with no SNI — hardens the entry point

# ============================================================
# Logging
# ============================================================
logs:
  general:
    level: INFO  # Switch to DEBUG temporarily when diagnosing cert issues
  access:
    enabled: true  # Access logs — essential for debugging routing problems

# ============================================================
# Metrics (Prometheus)
# ============================================================
metrics:
  prometheus:
    enabled: true
    # ServiceMonitor will be enabled once kube-prometheus-stack is deployed.
    serviceMonitor:
      enabled: false
    # Expose per-entry-point and per-service metrics.
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# ============================================================
# Dashboard
# ============================================================
# The Traefik dashboard is useful for debugging routing.
# Expose it only via an IngressRoute scoped to Tailscale — never public.
# We will add the IngressRoute for the dashboard in a follow-up session
# once Tailscale ingress is configured.
ingressRoute:
  dashboard:
    enabled: false  # Disable the auto-generated IngressRoute (no auth on it)
                    # We will create a properly auth-protected one manually

api:
  dashboard: true  # Keep the dashboard API enabled — just not auto-exposed

# ============================================================
# Resources
# ============================================================
# Traefik is in the hot path for all HTTP traffic — give it guaranteed CPU.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# ============================================================
# RBAC / ServiceAccount
# ============================================================
rbac:
  enabled: true

serviceAccount:
  name: traefik

# ============================================================
# Security Context
# ============================================================
# Traefik v3 no longer needs to bind privileged ports directly —
# it uses the exposedPort mapping via the LoadBalancer Service.
# Running as non-root is safe and correct.
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

podSecurityContext:
  fsGroup: 65532