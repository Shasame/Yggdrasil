apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      # Seerr upstream image runs as node (UID 1000) natively —
      # no PUID/PGID env vars needed unlike linuxserver images.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seerr
          # Upstream seerr-team image — replaces deprecated jellyseerr/linuxserver.
          # v3.1.0 is a security release patching 3 CVEs — do not use older tags.
          # Check releases: https://github.com/seerr-team/seerr/releases
          image: ghcr.io/seerr-team/seerr:v3.1.0
          env:
            - name: TZ
              value: "Europe/Paris"
            - name: LOG_LEVEL
              value: "info"
          ports:
            - containerPort: 5055
              name: http
          volumeMounts:
            - name: config
              # Upstream image uses /app/config, not /config (linuxserver convention)
              mountPath: /app/config
          readinessProbe:
            httpGet:
              # Correct health endpoint for seerr — /health does not exist
              path: /api/v1/settings/public
              port: 5055
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/settings/public
              port: 5055
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config