# All media stack IngressRoutes.
# TLS termination via Traefik tlsStore defaultCertificate (*.home.shasame.fr).
# No per-route secretName — see infrastructure/traefik/values.yaml for tlsStore config.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prowlarr.home.shasame.fr`)
      kind: Rule
      services:
        - name: prowlarr
          port: 9696
  tls: {}
