apiVersion: batch/v1
kind: Job
metadata:
  name: qui-init-dirs
  namespace: media
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      # Runs as root to create dirs and set ownership
      securityContext:
        runAsUser: 0
      containers:
        - name: init-dirs
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /media/cross-seed
              # qui runs as 1000:1000 (same as linuxserver convention in your stack)
              chown -R 1000:1000 /media/cross-seed
              echo "cross-seed directory ready"
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          hostPath:
            path: /var/mnt/media
            type: Directory