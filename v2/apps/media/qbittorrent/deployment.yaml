apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    # Recreate mandatory — shared network namespace means two pods with same
    # WireGuard key would cause tunnel conflicts and split-brain.
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # Required for Gluetun's WireGuard kernel module access and
      # iptables kill-switch manipulation.
      # NET_ADMIN: manage network interfaces and routes
      # SYS_MODULE: load wireguard kernel module (may be needed on some kernels)
      initContainers: []
      containers:
        # --- Gluetun: VPN tunnel + kill-switch ---
        # Must be listed first — it owns the network namespace.
        # qBittorrent inherits its network stack.
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:v3.41.1
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: SERVER_COUNTRIES
              value: "Switzerland"
            - name: VPN_PORT_FORWARDING
              value: "on"
              # UP_COMMAND: fires when forwarded port is assigned or renewed.
            # Updates qBittorrent listening port via its API.
            # Requires: WebUI enabled on 8080 + localhost bypass auth ticked.
            # {{PORT}} and {{VPN_INTERFACE}} are substituted by Gluetun at runtime.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: "/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data \"json={\\\"listen_port\\\":{{PORT}},\\\"current_network_interface\\\":\\\"{{VPN_INTERFACE}}\\\",\\\"random_port\\\":false,\\\"upnp\\\":false}\" http://127.0.0.1:8080/api/v2/app/setPreferences'"
            # DOWN_COMMAND: fires when VPN tunnel drops.
            # Resets qBittorrent to loopback only — belt and suspenders on top
            # of Gluetun's kill-switch. Prevents torrent traffic on real IP.
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: "/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data \"json={\\\"listen_port\\\":0,\\\"current_network_interface\\\":\\\"lo\\\"}\" http://127.0.0.1:8080/api/v2/app/setPreferences'"

            - name: FIREWALL_OUTBOUND_SUBNETS
              # Allow traffic to cluster service CIDR so arr services can reach
              # qBittorrent's HTTP API without going through the VPN.
              value: "10.96.0.0/12,10.244.0.0/16"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: HTTP_CONTROL_SERVER_ADDRESS
              value: ":8000"
            - name: HTTP_CONTROL_SERVER_LOG
              value: "off"
            - name: WIREGUARD_MTU
              value: "1320"
            - name: LOG_LEVEL
              value: "debug"
            - name: DOT
              value: "off"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-vpn-credentials
                  key: WIREGUARD_ADDRESSES
            # Control server authentication — required since v3.40.
            # GLUETUN_API_KEY must be defined before this var so Kubernetes
            # can substitute $(GLUETUN_API_KEY) at pod creation time.
            - name: GLUETUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-control-api-key
                  key: GLUETUN_API_KEY
            - name: HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE
              value: '{"auth":"apikey","apikey":"$(GLUETUN_API_KEY)"}'
          ports:
            # Gluetun exposes qBittorrent's port — shared netns means Service
            # traffic hits Gluetun's network stack, which forwards to qBittorrent.
            - containerPort: 8080
              name: qbt-http
            # Gluetun control API — used for health checks and status
            - containerPort: 8000
              name: gluetun-api
          readinessProbe:
            exec:
              # Gluetun ships this script specifically for container health checking.
              # It checks the VPN tunnel state internally without requiring a network
              # connection to the control server — immune to DNS override issues.
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 348Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
            - name: gluetun-data
              mountPath: /tmp/gluetun

        # --- qBittorrent: download client ---
        # Shares network namespace with Gluetun — sees VPN interface only.
        - name: qbittorrent
          # Check current: https://fleet.linuxserver.io/image?name=linuxserver/qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:5.1.4-r3-ls453
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
            - name: WEBUI_PORT
              value: "8080"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          # No ports declared here — Gluetun owns the network namespace and
          # declares the ports on behalf of the shared pod network.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
        # --- VPN watchdog: restarts Gluetun tunnel on crash or port-forward loss ---
        # Shares network namespace with Gluetun — localhost API calls work directly.
        # Only handles VPN reset logic — port updates are handled by UP/DOWN commands.
        - name: vpn-watchdog
          image: curlimages/curl:8.11.0
          env:
            - name: GLUETUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-control-api-key
                  key: GLUETUN_API_KEY
          command:
            - /bin/sh
            - -c
            - |
              GLUETUN_API="http://localhost:8000"
              # How long VPN must be unhealthy before forcing a restart
              RESET_TIMEOUT=300
              UNHEALTHY_SINCE_FILE="/tmp/vpn-unhealthy-since"
              PORT_EMPTY_SINCE_FILE="/tmp/port-empty-since"
              PORT_FILE="/tmp/gluetun/forwarded_port"
              INTERVAL=30

              echo "[watchdog] starting — checking every ${INTERVAL}s"

              while true; do
                # --- Check VPN status via Gluetun control API ---
                VPN_STATUS=$(curl -sf -H "X-API-Key: ${GLUETUN_API_KEY}" "${GLUETUN_API}/v1/vpn/status" 2>/dev/null \
                  | grep -o '"status":"[^"]*"' \
                  | cut -d'"' -f4)

                if [ "$VPN_STATUS" != "running" ]; then
                  # VPN not running — start or extend the unhealthy timer
                  rm -f "$PORT_EMPTY_SINCE_FILE"
                  if [ ! -f "$UNHEALTHY_SINCE_FILE" ]; then
                    date +%s > "$UNHEALTHY_SINCE_FILE"
                    echo "[watchdog] VPN status='${VPN_STATUS}', watching..."
                  else
                    ELAPSED=$(( $(date +%s) - $(cat "$UNHEALTHY_SINCE_FILE") ))
                    echo "[watchdog] VPN unhealthy for ${ELAPSED}s (threshold: ${RESET_TIMEOUT}s)"
                    if [ "$ELAPSED" -ge "$RESET_TIMEOUT" ]; then
                      echo "[watchdog] threshold reached — restarting VPN via Gluetun API"
                      curl -sf -X PUT \
                        -H 'Content-Type: application/json' \
                        -H "X-API-Key: ${GLUETUN_API_KEY}" \
                        -d '{"status":"stopped"}' \
                        "${GLUETUN_API}/v1/vpn/status" > /dev/null || true
                      sleep 5
                      curl -sf -X PUT \
                        -H 'Content-Type: application/json' \
                        -H "X-API-Key: ${GLUETUN_API_KEY}" \
                        -d '{"status":"running"}' \
                        "${GLUETUN_API}/v1/vpn/status" > /dev/null || true
                      rm -f "$UNHEALTHY_SINCE_FILE"
                      echo "[watchdog] VPN restart issued"
                    fi
                  fi

                else
                  # VPN is running — reset the unhealthy timer
                  rm -f "$UNHEALTHY_SINCE_FILE"

                  # --- Check port forwarding is active ---
                  PORT=$(cat "$PORT_FILE" 2>/dev/null | tr -d '[:space:]')

                  if [ -z "$PORT" ]; then
                    # VPN up but no forwarded port yet — start or extend timer
                    if [ ! -f "$PORT_EMPTY_SINCE_FILE" ]; then
                      date +%s > "$PORT_EMPTY_SINCE_FILE"
                      echo "[watchdog] port file empty, watching..."
                    else
                      ELAPSED=$(( $(date +%s) - $(cat "$PORT_EMPTY_SINCE_FILE") ))
                      echo "[watchdog] port empty for ${ELAPSED}s (threshold: ${RESET_TIMEOUT}s)"
                      if [ "$ELAPSED" -ge "$RESET_TIMEOUT" ]; then
                        echo "[watchdog] no port for ${ELAPSED}s — restarting VPN"
                        curl -sf -X PUT \
                          -H 'Content-Type: application/json' \
                          -H "X-API-Key: ${GLUETUN_API_KEY}" \
                          -d '{"status":"stopped"}' \
                          "${GLUETUN_API}/v1/vpn/status" > /dev/null || true
                        sleep 5
                        curl -sf -X PUT \
                          -H 'Content-Type: application/json' \
                          -H "X-API-Key: ${GLUETUN_API_KEY}" \
                          -d '{"status":"running"}' \
                          "${GLUETUN_API}/v1/vpn/status" > /dev/null || true
                        rm -f "$PORT_EMPTY_SINCE_FILE"
                        echo "[watchdog] VPN restart issued"
                      fi
                    fi
                  else
                    # Port is present — reset the empty timer
                    rm -f "$PORT_EMPTY_SINCE_FILE"
                  fi
                fi

                sleep "$INTERVAL"
              done
          volumeMounts:
            - name: gluetun-data
              mountPath: /tmp/gluetun
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          hostPath:
            path: /var/mnt/media
            type: Directory
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: gluetun-data
          emptyDir: {}
