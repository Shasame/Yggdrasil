# apps/argocd-apps/argocd-app.yaml
# ArgoCD self-management Application.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: []
spec:
  project: default
  sources:                                    # plural — dual-source pattern
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "9.5.15"
      helm:
        valueFiles:
          # $values is a reserved alias pointing to the second source below
          - $values/v2/infrastructure/argocd/values.yaml
    - repoURL: https://github.com/Shasame/Yggdrasil.git
      targetRevision: main
      ref: values                             # defines the $values alias above
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true