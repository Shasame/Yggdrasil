# apps/argocd-apps/argocd-app.yaml
# ArgoCD self-management Application.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # Sync wave -1 — ArgoCD reconciles itself before any other application.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    # Intentionally empty — do NOT add app-finalizer here.
    # If this Application were ever accidentally deleted with the finalizer set,
    # ArgoCD would delete its own namespace and take down all of GitOps.
    []
spec:
  project: default
  source:
    repoURL: 'https://github.com/Shasame/Yggdrasil.git'
    targetRevision: main
    path: v2/infrastructure/argocd
    helm:
      chart: argo-cd
      version: "9.5.15"  # must match bootstrap install version exactly
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false      # Never auto-prune ArgoCD itself — explained below
      selfHeal: true    # Correct drift, but never delete
    syncOptions:
      - CreateNamespace=false   # namespace pre-exists from bootstrap
      - ServerSideApply=true    # required for CRD ownership fields in chart v9