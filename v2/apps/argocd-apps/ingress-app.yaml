# Sync wave 3: after cert-manager (0), issuers (1), and traefik (2) are healthy.
# The Certificate will not issue until the ClusterIssuer and Traefik are ready.
# The IngressRoute will not route until Traefik is running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Shasame/Yggdrasil.git
    targetRevision: HEAD
    path: v2/infrastructure/argocd
    # Only sync the ingress manifests — not values.yaml (that's for the
    # argocd chart Application via dual-source). We use an include filter
    # to be explicit about what this Application owns.
    directory:
      include: "ingressroute.yaml"

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false