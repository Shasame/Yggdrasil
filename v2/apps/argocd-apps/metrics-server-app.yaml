# Sync wave 2: after kubelet-csr-approver (wave 1) is healthy and has
# approved the node's kubelet serving CSR. If Metrics Server starts before
# kubelet certs are signed, it will fail to scrape kubelets and report
# no metrics — it recovers automatically once certs are in place, but
# ordering avoids the initial error noise.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.13.0

      helm:
        valueFiles:
          - $values/v2/infrastructure/metrics-server/values.yaml

    - repoURL: https://github.com/Shasame/Yggdrasil.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # kube-system already exists